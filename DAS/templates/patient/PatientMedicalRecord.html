{% extends 'base/layout.html' %}
{% block title %}Patient Medical Form{% endblock %}

                            <option value="2021">2021</option>
                            <option value="2020">2020</option>

                    </div>

                    </div>
                </div>

                <!-- Emergency Contact -->
                <h2 class="text-xl font-semibold text-gray-800 mb-4">In Case of Emergency</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input type="text" name="emergency_first_name" placeholder="First Name" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">&nbsp;</label>
                        <input type="text" name="emergency_last_name" placeholder="Last Name" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                    <input type="text" name="emergency_street" placeholder="Street address" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                    <input type="text" name="emergency_street_2" placeholder="Street address line 2" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" name="emergency_city" placeholder="City" 
                            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <input type="text" name="emergency_state" placeholder="State / Province" 
                            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Home phone</label>
                        <input type="tel" name="emergency_home_phone" placeholder="(000) 000-0000" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Work phone</label>
                        <input type="tel" name="emergency_work_phone" placeholder="(000) 000-0000" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Medical History -->
                <h2 class="text-xl font-semibold text-gray-800 mb-4">General Medical History</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Have you had the Hepatitis B vaccination?</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="hepatitis_b" value="yes" class="mr-2">
                            <span>Yes</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="hepatitis_b" value="no" class="mr-2">
                            <span>No</span>
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Please list information about any information that be provided prior to emergency 
                        or that can't be obtained at birth
                    </label>
                    <textarea name="emergency_info" rows="3" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div class="mb-4">
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <p class="font-medium text-gray-700 mb-2">Chronic Flu Information</p>
                            <label class="flex items-center mb-2">
                                <input type="checkbox" name="chronic_flu_smoking" class="mr-2">
                                <span class="text-sm">SMOKING</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="chronic_flu_not_smoking" class="mr-2">
                                <span class="text-sm">NOT SMOKING</span>
                            </label>
                        </div>
                        <div>
                            <p class="font-medium text-gray-700 mb-2">Drinking</p>
                            <label class="flex items-center mb-2">
                                <input type="checkbox" name="drinking_smoking" class="mr-2">
                                <span class="text-sm">SMOKING</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="drinking_not_smoking" class="mr-2">
                                <span class="text-sm">NOT SMOKING</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Significant Medical History (Surgeries, Injuries, serious diseases)
                    </label>
                    <textarea name="medical_history" rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        List any Medical Problems (diabetes, surgeries, tuberculosis)
                    </label>
                    <textarea name="medical_problems" rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        List any medications taken regularly
                    </label>
                    <textarea name="medications" rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-2">List any allergies</label>
                    <textarea name="allergies" rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Insurance Details -->
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Medical Insurance Details</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Do you have medical insurance?</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="has_insurance" value="yes" class="mr-2">
                            <span>Yes</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="has_insurance" value="no" class="mr-2">
                            <span>No</span>
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Name of Insurance Company</label>
                    <input type="text" name="insurance_company" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                    <input type="text" name="insurance_street" placeholder="Street Address" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                    <input type="text" name="insurance_street_2" placeholder="Street Address Line 2" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-3">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" name="insurance_city" placeholder="City" 
                            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <input type="text" name="insurance_state" placeholder="State / Province" 
                            class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Policy Number</label>
                    <input type="text" name="policy_number" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Expiry Date</label>
                    <div class="grid grid-cols-3 gap-4">
                        <select name="expiry_month" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Please select a day</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>

                            <option value="">Please select a month</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>
                            <option value="30">30</option>
                            <option value="31">31</option>
                        </select>
                        <select name="expiry_year" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Please select a year</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                            <option value="2031">2031</option>
                            <option value="2032">2032</option>
                            <option value="2033">2033</option>
                            <option value="2034">2034</option>
                            <option value="2035">2035</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" 
                            class="bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-8 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                        Submit Form
                    </button>
                </div>
            </form>
        </div>
    </body>
{% endblock %}
